[package]
name = "tc_fp_curve_v2"
description = "Prime-field short-Weierstrass elliptic curves backed by Montgomery arithmetic."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
# secp112r1, secp112r2 and secp128r2: weak, for interoperability only.
small-curves = []

[dependencies]
tc_ec_core_v2 = { version = "0.1.0" , path = "../tc_ec_core_v2" }
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_constant_time = "0.1.0"

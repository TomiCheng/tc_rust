[package]
name = "tc_ec"
description = "Pure-Rust elliptic-curve and supporting finite-field foundations ported from Bouncy Castle C#."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["tc_bigint/std"]

[dependencies]
rand_core = { workspace = true }
tc_bigint = { version = "0.1.0", path = "../tc_bigint", default-features = false }

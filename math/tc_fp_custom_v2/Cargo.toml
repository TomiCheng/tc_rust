[package]
name = "tc_fp_custom_v2"
description = "SEC and SM2 prime elliptic curves with per-field specialized arithmetic, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
small-curves = []

[dependencies]
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_constant_time = "0.1.0"
tc_ec_core_v2 = { version = "0.1.0", path = "../tc_ec_core_v2" }
tc_zeroize = "0.1.0"

[dev-dependencies]
tc_fp_curve_v2 = { version = "0.1.0", path = "../tc_fp_curve_v2" }

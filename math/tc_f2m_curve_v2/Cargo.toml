[package]
name = "tc_f2m_curve_v2"
description = "Binary-field short-Weierstrass elliptic curves over GF(2^m)."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
# sect113r1, sect113r2, sect131r1 and sect131r2: weak, for interoperability only.
small-curves = []

[dependencies]
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_binpoly = { version = "0.1.0", features = ["alloc"] }
tc_constant_time = "0.1.0"
tc_ec_core_v2 = { version = "0.1.0", path = "../tc_ec_core_v2" }
tc_zeroize = "0.1.0"

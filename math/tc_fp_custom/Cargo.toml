[package]
name = "tc_fp_custom"
description = "Per-curve specialized prime-field elliptic curves."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
bench-internals = []

[dependencies]
tc_constant_time = "0.1.0"
tc_bigint = { version = "0.1.0", path = "../tc_bigint", default-features = false, features = ["alloc"] }
tc_ec_core = { version = "0.1.0", path = "../tc_ec_core" }

[dev-dependencies]
tc_f2m_custom = { version = "0.1.0", path = "../tc_f2m_custom" }
criterion = { workspace = true }
tc_fp_curve = { version = "0.1.0", path = "../tc_fp_curve" }

[[bench]]
name = "secp256r1"
harness = false
required-features = ["bench-internals"]

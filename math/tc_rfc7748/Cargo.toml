[package]
name = "tc_rfc7748"
description = "Allocation-free RFC 7748 X25519 and X448 primitives ported from Bouncy Castle C#."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = ["tc_runtime?/std"]
x86 = ["dep:tc_runtime"]

[dependencies]
rand_core = { workspace = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = { version = "0.1.0", path = "../../core/tc_runtime", optional = true }

[dev-dependencies]
criterion = { workspace = true }
tc_bigint = { version = "0.1.0", path = "../tc_bigint" }

[[bench]]
name = "rfc7748"
harness = false

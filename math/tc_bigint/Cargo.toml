[package]
name = "tc_bigint"
description = "Little-endian fixed and arbitrary-precision integer primitives."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["alloc", "rand_core"]
alloc = []
rand_core = ["dep:rand_core"]

[dependencies]
tc_constant_time = "0.1.0"
tc_zeroize = { version = "0.1.0", path = "../../core/tc_zeroize" }
rand_core = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
num-bigint = "0.5.1"

[[bench]]
name = "integer_types"
harness = false
required-features = ["alloc"]

[package]
name = "tc_binpoly"
description = "Binary-polynomial arithmetic over GF(2), ported from Bouncy Castle C#."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["alloc", "std", "x86"]
alloc = []
bench-internals = ["alloc"]
std = ["alloc", "tc_runtime?/std"]
x86 = ["dep:tc_runtime"]

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = { version = "0.1.0", optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "tuning"
harness = false
required-features = ["bench-internals"]

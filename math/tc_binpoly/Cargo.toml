[package]
name = "tc_binpoly"
description = "Binary-polynomial arithmetic over GF(2), ported from Bouncy Castle C#."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
force-scalar = ["tc_runtime/disable-x86-pclmulqdq"]

[dependencies]
tc_runtime = { version = "0.1.0", path = "../../core/tc_runtime" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "baseline"
harness = false

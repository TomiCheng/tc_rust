[package]
name = "tc_prime"
description = "FIPS 186-4 prime generation and primality testing, ported from Bouncy Castle C#."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["alloc"]
alloc = ["tc_bigint/alloc"]
digest = ["dep:tc_digest", "alloc"]

[dependencies]
rand_core = { workspace = true }
tc_bigint = { version = "0.1.0", path = "../tc_bigint", default-features = false, features = ["rand_core"] }
tc_digest = { version = "0.1.0", path = "../../crypto/tc_digest", optional = true }

[dev-dependencies]
rand = "0.10.0"
tc_sha = { version = "0.1.0", path = "../../crypto/digest/tc_sha" }

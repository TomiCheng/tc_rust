[package]
name = "tc_f2m_custom_v2"
description = "SEC binary elliptic curves with per-field specialized arithmetic, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_constant_time = "0.1.0"
tc_ec_core_v2 = { version = "0.1.0", path = "../tc_ec_core_v2" }
tc_zeroize = "0.1.0"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"

[dev-dependencies]
criterion = { workspace = true }
tc_binpoly = { version = "0.1.0", features = ["alloc"] }
tc_f2m_curve_v2 = { path = "../tc_f2m_curve_v2" }

[[bench]]
name = "compare"
harness = false

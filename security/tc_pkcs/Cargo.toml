[package]
name = "tc_pkcs"
description = "PKCS#8 private keys, PKCS#10 certification requests and PKCS#12 stores, after Bouncy Castle C#'s Org.BouncyCastle.Pkcs."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo", features = ["rsa", "fp-custom", "fp-curve", "f2m-custom", "f2m-curve", "cfrg-curves", "pbe", "sha", "md", "aes", "des", "rc-cipher"] }
tc_asn1 = { version = "0.1.4", features = ["std"] }
tc_asn1_pkcs = { version = "0.1.0", path = "../../asn1/tc_asn1_pkcs" }
tc_asn1_x500 = "0.1.0"
tc_asn1_x509 = "0.1.0"
tc_x509 = { version = "0.1.0", path = "../tc_x509" }
tc_asn1_x9 = { version = "0.1.0", path = "../../asn1/tc_asn1_x9" }
tc_asym_cipher = "0.2.0"
tc_bigint = "0.1.0"
tc_ec_core = "0.1.0"
tc_ec_key = { version = "0.1.0", path = "../../crypto/tc_ec_key" }
tc_f2m_curve = { version = "0.1.1", features = ["small-curves"] }
tc_f2m_custom = { version = "0.1.0", features = ["small-curves"] }
tc_fp_curve = { version = "0.1.1", features = ["small-curves"] }
tc_fp_custom = { version = "0.1.0", features = ["small-curves"] }
tc_rsa = "0.2.0"
tc_zeroize = "0.1.0"

[package]
name = "tc_algo_asn1"
description = "The ASN.1 side of tc_algo: keys as SubjectPublicKeyInfo and PKCS#8, and AlgorithmIdentifier parameters, for the X.509, PKCS and CMS crates."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo", features = ["rsa", "ecdsa", "dsa", "sha", "fp-custom", "fp-curve", "f2m-custom", "f2m-curve", "cfrg-curves", "sm2", "sm3", "keccak", "md", "ripemd", "gost3411", "macs", "aes", "des", "camellia", "seed", "aria", "sm4", "chacha-aead"] }
tc_signer = "0.1.0"
tc_digest = "0.1.1"
tc_macs = "0.1.1"
tc_constant_time = "0.1.0"
tc_buffered_cipher = "0.2.0"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
tc_asn1 = { version = "0.1.4", features = ["std"] }
tc_asn1_cms = { version = "0.1.0", path = "../../asn1/tc_asn1_cms" }
tc_asn1_pkcs = { version = "0.1.0", path = "../../asn1/tc_asn1_pkcs" }
tc_asn1_x509 = "0.1.0"
tc_asn1_x9 = { version = "0.1.0", path = "../../asn1/tc_asn1_x9" }
tc_asym_cipher = "0.2.0"
tc_bigint = "0.1.0"
tc_ec_core = "0.1.0"
tc_f2m_curve = { version = "0.1.1", features = ["small-curves"] }
tc_f2m_custom = { version = "0.1.0", features = ["small-curves"] }
tc_fp_curve = { version = "0.1.1", features = ["small-curves"] }
tc_fp_custom = { version = "0.1.0", features = ["small-curves"] }
tc_rsa = "0.2.0"
tc_zeroize = "0.1.0"

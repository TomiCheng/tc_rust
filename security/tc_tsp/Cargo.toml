[package]
name = "tc_tsp"
description = "RFC 3161 time-stamp requests, tokens and responses, after Bouncy Castle C#'s Org.BouncyCastle.Tsp."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo", features = ["rsa", "sha"] }
tc_asn1 = { version = "0.1.4", features = ["chrono", "std"] }
tc_asn1_cmp = { version = "0.1.0", path = "../../asn1/tc_asn1_cmp" }
tc_asn1_cms = { version = "0.1.0", path = "../../asn1/tc_asn1_cms" }
tc_asn1_ess = { version = "0.1.0", path = "../../asn1/tc_asn1_ess" }
tc_asn1_tsp = { version = "0.1.0", path = "../../asn1/tc_asn1_tsp" }
tc_asn1_x500 = "0.1.0"
tc_asn1_x509 = { version = "0.1.0", features = ["chrono"] }
tc_cms = { version = "0.1.0", path = "../tc_cms" }
tc_x509 = { version = "0.1.0", path = "../tc_x509" }

[dev-dependencies]
tc_asn1_pkcs = { version = "0.1.0", path = "../../asn1/tc_asn1_pkcs" }
tc_pkcs = { version = "0.1.0", path = "../tc_pkcs" }

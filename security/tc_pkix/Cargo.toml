[package]
name = "tc_pkix"
description = "X.509 certification path validation and building after RFC 5280, after Bouncy Castle C#'s Org.BouncyCastle.Pkix."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
tc_asn1 = { version = "0.1.4", features = ["chrono", "std"] }
tc_asn1_x500 = "0.1.0"
tc_asn1_x509 = { version = "0.1.0", features = ["chrono"] }
tc_x509 = { version = "0.1.0", path = "../tc_x509" }

[dev-dependencies]

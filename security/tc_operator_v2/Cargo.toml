[package]
name = "tc_operator_v2"
description = "Signature, verifier, digest, MAC and cipher operators over AlgorithmIdentifier, after Bouncy Castle C#'s Org.BouncyCastle.Crypto.Operators."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_algo_v2 = { version = "0.1.0", path = "../../crypto/tc_algo_v2" }
tc_asn1 = "0.1.2"
tc_asn1_x509 = { version = "0.1.0", path = "../../asn1/tc_asn1_x509" }

[dev-dependencies]
tc_algo_v2 = { version = "0.1.0", path = "../../crypto/tc_algo_v2", features = ["sha256"] }

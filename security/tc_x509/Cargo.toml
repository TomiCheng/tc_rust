[package]
name = "tc_x509"
description = "X.509 certificates, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
# The algorithms a certificate needs are always on, not behind features
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo", features = ["rsa"] }
tc_asn1 = { version = "0.1.4", features = ["chrono", "std"] }
tc_asn1_cms = { version = "0.1.0", path = "../../asn1/tc_asn1_cms" }
tc_asn1_pkcs = { version = "0.1.0", path = "../../asn1/tc_asn1_pkcs" }
tc_asn1_x500 = "0.1.0"
tc_asn1_x509 = { version = "0.1.0", features = ["chrono"] }
tc_pem = { version = "0.1.0", path = "../../util/tc_pem" }
tc_asym_cipher = "0.2.0"
tc_digest = "0.1.1"
tc_sha = "0.1.1"
tc_bigint = "0.1.0"
tc_rsa = "0.2.0"

[dev-dependencies]
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo", features = ["rsa", "sha256", "hmac-sha256"] }

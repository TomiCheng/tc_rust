[package]
name = "tc_ocsp"
description = "OCSP request generation, response signing and validation."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.38", default-features = false }
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo" }
tc_asn1 = { version = "0.1.4", features = ["chrono", "std"] }
tc_asn1_ocsp = { version = "0.1.0", path = "../../asn1/tc_asn1_ocsp" }
tc_asn1_x509 = { version = "0.1.0", features = ["chrono"] }
tc_x509 = { version = "0.1.0", path = "../tc_x509" }
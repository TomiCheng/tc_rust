[package]
name = "tc_cms"
description = "CMS signed, enveloped and authenticated data, after Bouncy Castle C#'s Org.BouncyCastle.Cms."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo", features = ["rsa", "sha"] }
tc_asn1 = { version = "0.1.4", features = ["std"] }
tc_asn1_cms = { version = "0.1.0", path = "../../asn1/tc_asn1_cms" }
tc_asn1_x500 = "0.1.0"
tc_asn1_x509 = { version = "0.1.0", features = ["chrono"] }
tc_x509 = { version = "0.1.0", path = "../tc_x509" }

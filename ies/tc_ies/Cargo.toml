[package]
name = "tc_ies"
description = "The Integrated Encryption Scheme, after Bouncy Castle's IesEngine."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
# BC 的第二個建構式與 IesWithCipherParameters：以分組加密取代 XOR，K1 加上可選的 IV 交給 cipher
cipher = ["dep:tc_buffered_cipher", "dep:tc_block_modes"]

[dependencies]
tc_agreement = { version = "0.1.0", path = "../../crypto/agreement/tc_agreement" }
# CipherDirection，以及給 MAC 與 cipher 的 KeyRef
tc_block_cipher = "0.1.0"
# 解密時比對 MAC 不提早結束
tc_constant_time = "0.1.0"
tc_kdf = { version = "0.1.0", path = "../../kdf/tc_kdf" }
tc_macs = "0.1.0"
# 共享秘密 Z 與衍生的 K1、K2 用完即清除
tc_zeroize = { version = "0.1.0", features = ["alloc"] }
tc_buffered_cipher = { version = "0.1.1", features = ["alloc"], optional = true }
# 給 cipher 的 init 參數 KeyWithIvRef（IV 可以是空的）
tc_block_modes = { version = "0.1.0", optional = true }

[dev-dependencies]
# BC 的 ECIESTest：secp192r1 上的靜態金鑰，KDF2 與 HMAC 都用 SHA-1，cipher 版用 Twofish/CBC
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_block_modes = { version = "0.1.0", features = ["alloc"] }
tc_ec_key = { version = "0.1.0", path = "../../crypto/tc_ec_key" }
tc_ecdh_v2 = { version = "0.1.0", path = "../../crypto/agreement/tc_ecdh_v2" }
tc_fp_custom = { version = "0.1.0", features = ["small-curves"] }
tc_macs = { version = "0.1.0", features = ["hmac", "alloc"] }
tc_sha = "0.1.1"
tc_twofish_v2 = { version = "0.1.0", path = "../../block_cipher/tc_twofish" }

[package]
name = "tc_openpgp"
description = "OpenPGP keys, signatures and encryption, after Bouncy Castle C#'s Org.BouncyCastle.Bcpg.OpenPgp."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_zlib = { version = "0.1.0", path = "../../util/tc_zlib", optional = true }
rand = { version = "0.10", default-features = false, features = ["sys_rng"], optional = true }
rand_core = { workspace = true, optional = true }
tc_asym_cipher = "0.2.0"
tc_asym_encoding = { version = "0.2.0", optional = true }
tc_constant_time = { version = "0.1.0", optional = true }
tc_bigint = { version = "0.1.0", optional = true }
tc_pwhash = { version = "0.1.0", optional = true }
tc_zeroize = { version = "0.1.0", optional = true }
tc_rsa = { version = "0.2.0", optional = true }
tc_algo = { version = "0.1.0", path = "../../crypto/tc_algo" }
tc_openpgp_packet = { version = "0.1.0", path = "../tc_openpgp_packet" }

[features]
cfrg-curves = ["tc_algo/cfrg-curves", "tc_algo/sha", "dep:rand", "dep:rand_core"]
encryption = ["dep:tc_zlib", "cfrg-curves", "tc_algo/aes", "tc_algo/key-wrap", "tc_algo/kdf", "dep:tc_zeroize"]
legacy-encryption = ["dep:tc_zlib", "rsa", "tc_algo/aes", "dep:rand", "rand/std_rng", "dep:tc_asym_encoding", "dep:tc_constant_time", "dep:tc_zeroize"]
secret-key = ["cfrg-curves", "tc_algo/aes", "tc_algo/kdf", "dep:tc_pwhash", "dep:tc_zeroize"]
rsa = ["tc_algo/rsa", "tc_algo/sha", "dep:tc_bigint", "dep:tc_rsa"]

[[test]]
name = "rsa_key_pair"
required-features = ["rsa"]

[[test]]
name = "curve25519_key_pair"
required-features = ["cfrg-curves"]

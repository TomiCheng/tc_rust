[package]
name = "tc_key_wrap"
description = "Key wrapping implementations ported from the Bouncy Castle C# library as a learning project."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# std 會一路傳遞給 tc_block_cipher，讓底層 AES 在支援的平台上啟用 AES-NI。
std = ["tc_block_cipher/std"]

[dependencies]
# Wrapper trait 需要 alloc,故開啟 core 的 alloc feature。
tc_crypto_core = { path = "../tc_crypto_core", features = ["alloc"] }
tc_cipher_core = { path = "../tc_cipher_core" }
# 由本 crate 的 std feature 決定是否開啟，故關掉底層 crate 的預設 feature。
tc_block_cipher = { path = "../tc_block_cipher", default-features = false }

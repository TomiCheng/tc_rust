[package]
name = "tc_gost3410"
description = "GOST R 34.10-94 signatures, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
rand_core = { workspace = true }
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_dsa = { version = "0.1.0", path = "../tc_dsa" }
tc_gost3410_key = { version = "0.1.0", path = "../../crypto/tc_gost3410_key" }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
rand_core = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_gost3411 = "0.1.0"
tc_signer = { version = "0.1.0", path = "../tc_signer" }

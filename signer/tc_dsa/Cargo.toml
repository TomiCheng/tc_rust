[package]
name = "tc_dsa"
description = "The DSA-family signature contracts, after Bouncy Castle's IDsa."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
rand_core = { workspace = true }
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_digest = "0.1.0"
tc_macs = { version = "0.1.0", features = ["hmac", "alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
tc_sha = "0.1.1"

[package]
name = "tc_ecgost3410"
description = "GOST R 34.10-2001/2012 elliptic-curve signatures, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_dsa = { version = "0.1.0", path = "../tc_dsa" }
tc_ec_core = "0.1.0"
tc_ec_key = { version = "0.1.0", path = "../../crypto/tc_ec_key" }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
num-traits = { version = "0.2.19", default-features = false }
rand = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_digest = "0.1.0"
tc_fp_curve = "0.1.0"
tc_gost3411 = "0.1.0"
tc_signer = { version = "0.1.0", path = "../tc_signer" }

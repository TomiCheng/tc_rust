[package]
name = "tc_dstu4145"
description = "DSTU 4145-2002 elliptic-curve signatures over binary fields, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_asym_cipher = "0.1.0"
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_dsa = { version = "0.1.0", path = "../tc_dsa" }
tc_ec_core = "0.1.0"
tc_ec_key = { version = "0.1.0", path = "../../crypto/tc_ec_key" }
tc_f2m_curve = "0.1.0"
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
rand_core = { workspace = true }
tc_digest = "0.1.0"
tc_sha = "0.1.1"
tc_signer = { version = "0.1.0", path = "../tc_signer" }

[package]
name = "tc_asn1_ess"
description = "Enhanced security services (RFC 2634, RFC 5035) and S/MIME (RFC 8551) attribute structures, after Bouncy Castle's Asn1.Ess and Asn1.Smime."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_asn1 = "0.1.2"
tc_asn1_cms = { version = "0.1.0", path = "../tc_asn1_cms" }
tc_asn1_x509 = { version = "0.1.0", path = "../tc_asn1_x509" }

[dev-dependencies]
tc_asn1_x500 = "0.1.0"

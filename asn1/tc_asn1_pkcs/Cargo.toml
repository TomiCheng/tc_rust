[package]
name = "tc_asn1_pkcs"
description = "PKCS #1, #3, #5, #7, #8, #9, #10 and #12 structures on top of tc_asn1."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_asn1 = { version = "0.1.2", features = ["zeroize"] }
tc_zeroize = "0.1.0"
tc_asn1_x500 = "0.1.0"
tc_asn1_cms = { version = "0.1.0", path = "../tc_asn1_cms" }
tc_asn1_x509 = { version = "0.1.0", path = "../tc_asn1_x509" }

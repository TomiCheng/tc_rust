[package]
name = "tc_asn1_cmp"
description = "Certificate management protocol (RFC 4210) and certificate request message format (RFC 4211) structures, after Bouncy Castle's Asn1.Cmp and Asn1.Crmf."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_asn1 = "0.1.2"
tc_asn1_x500 = "0.1.0"
tc_asn1_cms = { version = "0.1.0", path = "../tc_asn1_cms" }
tc_asn1_pkcs = { version = "0.1.0", path = "../tc_asn1_pkcs" }
tc_asn1_x509 = { version = "0.1.0", path = "../tc_asn1_x509" }

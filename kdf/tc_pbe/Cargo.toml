[package]
name = "tc_pbe"
description = "Password-based key derivation for PBE, after Bouncy Castle's PbeParametersGenerator."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_digest = "0.1.0"
# PKCS#5 v2 的 PBKDF2 用 Hmac
tc_macs = { version = "0.1.0", features = ["hmac", "alloc"] }
# init 時複製一份密碼與 salt，drop 時清除
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
tc_md = "0.1.1"
tc_sha = "0.1.1"

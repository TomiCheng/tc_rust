[package]
name = "tc_pbe"
description = "Password-based key derivation for PBE, after Bouncy Castle's PbeParametersGenerator."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
# PKCS#5 v1（PBKDF1）、PKCS#12 與 OpenSSL 的產生器只用 tc_digest，一定有；PBKDF2 用到 HMAC，另開 feature
default = []
# PKCS#5 v2 的 PBKDF2，內部用 tc_macs 的 Hmac
pbkdf2 = ["dep:tc_macs", "tc_macs/hmac", "tc_macs/alloc"]

[dependencies]
tc_digest = "0.1.0"
tc_macs = { version = "0.1.0", optional = true }
# init 時複製一份密碼與 salt，drop 時清除
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
tc_md = "0.1.1"
tc_sha = "0.1.1"

[package]
name = "tc_pwhash"
description = "Password hashing schemes, after Bouncy Castle: Argon2, bcrypt with its OpenBSD hash strings, and scrypt."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
# Argon2 的 H0 與 H'
tc_blake = "0.1.0"
# bcrypt 字串以常數時間比對
tc_constant_time = "0.1.0"
tc_digest = "0.1.0"
# scrypt 前後兩次 PBKDF2-HMAC-SHA256
tc_pbe = { version = "0.1.0", path = "../tc_pbe" }
tc_sha = "0.1.1"
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

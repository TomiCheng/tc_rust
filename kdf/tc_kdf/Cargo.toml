[package]
name = "tc_kdf"
description = "Key derivation functions, after Bouncy Castle's IDerivationFunction."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_digest = "0.1.0"
# HKDF 用 Hmac；SP 800-108 對任何 Mac 泛型
tc_macs = { version = "0.1.0", features = ["hmac", "alloc"] }
# init 時複製一份秘密，drop 時清除
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
tc_aes = "0.1.0"
tc_macs = { version = "0.1.0", features = ["hmac", "cmac", "alloc"] }
tc_sha = "0.1.1"

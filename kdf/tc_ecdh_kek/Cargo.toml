[package]
name = "tc_ecdh_kek"
description = "The RFC 5753 ECDH KEK derivation for CMS, after Bouncy Castle's ECDHKekGenerator."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_asn1 = "0.1.2"
tc_asn1_cms = { version = "0.1.0", path = "../../asn1/tc_asn1_cms" }
tc_asn1_x509 = { version = "0.1.0", path = "../../asn1/tc_asn1_x509" }
tc_digest = "0.1.0"
# Kdf2 在 init 時複製 Z，drop 或重新 init 時清除
tc_kdf = { version = "0.1.0", path = "../tc_kdf" }

[dev-dependencies]
tc_sha = "0.1.1"

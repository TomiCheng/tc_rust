[package]
name = "tc_chacha_v2"
description = "ChaCha, IETF ChaCha20 (RFC 8439) and XChaCha20 stream ciphers."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
rustcrypto = [
    "dep:chacha20",
    "dep:cipher",
    "chacha20/legacy",
    "chacha20/xchacha",
    "chacha20/zeroize",
]

[dependencies]
tc_stream_cipher = { path = "../tc_stream_cipher" }
chacha20 = { version = "0.10", optional = true }
# Not used directly: its `zeroize` feature wipes the keystream bytes that
# chacha20's stream wrapper buffers, which `chacha20/zeroize` alone leaves.
cipher = { version = "0.5", optional = true, features = ["zeroize"] }

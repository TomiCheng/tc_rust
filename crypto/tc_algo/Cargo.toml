[package]
name = "tc_algo"
description = "Name- and OID-based factories for digests, MACs, ciphers, signers and more, after Bouncy Castle C#'s Org.BouncyCastle.Security."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []

# Digest: each feature is a crate and turns on every digest and XOF of it
sha = ["dep:tc_sha"]
md = ["dep:tc_md"]
blake = ["dep:tc_blake"]
ripemd = ["dep:tc_ripemd"]
sm3 = ["dep:tc_sm3"]
gost3411 = ["dep:tc_gost3411"]
dstu7564 = ["dep:tc_dstu7564"]
misc-digest = ["dep:tc_misc_digest", "tc_misc_digest/tiger", "tc_misc_digest/whirlpool", "tc_misc_digest/photon-beetle", "tc_misc_digest/sparkle", "tc_misc_digest/xoodyak", "tc_misc_digest/haraka"]
keccak = ["dep:tc_keccak"]
ascon-hash = ["dep:tc_ascon_hash", "tc_ascon_hash/legacy"]
skein = ["dep:tc_skein"]

# Block cipher
aes = ["dep:tc_aes", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
des = ["dep:tc_des", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
camellia = ["dep:tc_camellia", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
aria = ["dep:tc_aria", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
sm4 = ["dep:tc_sm4", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
seed = ["dep:tc_seed", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
dstu7624 = ["dep:tc_dstu7624", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
blowfish = ["dep:tc_blowfish", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
twofish = ["dep:tc_twofish", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
serpent = ["dep:tc_serpent", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
cast = ["dep:tc_cast", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
misc-block-cipher = ["dep:tc_misc_block_cipher", "tc_misc_block_cipher/idea", "tc_misc_block_cipher/noekeon", "tc_misc_block_cipher/rijndael", "tc_misc_block_cipher/skipjack", "tc_misc_block_cipher/tea", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
rc-cipher = ["dep:tc_rc_cipher", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
gost28147 = ["dep:tc_gost28147", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
threefish = ["dep:tc_threefish", "dep:tc_aead_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]

# Stream cipher and AEAD
chacha = ["dep:tc_chacha", "dep:tc_stream_cipher", "dep:tc_block_modes"]
rc4-family = ["dep:tc_rc4_family", "dep:tc_stream_cipher", "dep:tc_block_modes"]
salsa20 = ["dep:tc_salsa20", "dep:tc_stream_cipher", "dep:tc_block_modes"]
hc = ["dep:tc_hc", "dep:tc_stream_cipher", "dep:tc_block_modes"]
chacha-aead = ["dep:tc_chacha_aead", "dep:tc_aead_cipher", "dep:tc_block_modes"]
ascon-aead = ["dep:tc_ascon_aead", "dep:tc_aead_cipher", "dep:tc_block_modes"]
grain128-aead = ["dep:tc_grain128_aead", "tc_grain128_aead/alloc", "dep:tc_aead_cipher", "dep:tc_block_modes"]
sparkle-aead = ["dep:tc_sparkle_aead", "dep:tc_aead_cipher", "dep:tc_block_modes"]

# MAC
macs = ["tc_macs/hmac", "tc_macs/cbc-mac", "tc_macs/cfb-mac", "tc_macs/cmac", "tc_macs/gmac", "tc_macs/vmpc-mac", "tc_macs/siphash", "tc_macs/alloc", "dep:tc_block_modes", "dep:tc_block_padding"]
iso9797-mac = ["des", "dep:tc_iso9797_mac"]
gost28147-mac = ["gost28147", "dep:tc_gost28147_mac"]
kmac = ["dep:tc_kmac", "dep:tc_block_modes"]
poly1305 = ["dep:tc_poly1305", "dep:tc_block_modes"]
skein-mac = ["dep:tc_skein_mac", "dep:tc_block_modes"]

# Key wrap
key-wrap = ["tc_key_wrap/rfc3394", "tc_key_wrap/rfc5649", "tc_key_wrap/rfc3211", "dep:tc_block_modes"]

# Asymmetric cipher, key pair and signer
rsa = ["dep:tc_asym_encoding", "dep:tc_asym_iso9796", "dep:tc_md", "dep:tc_rsa", "dep:tc_rsa_signer", "dep:tc_sha"]
elgamal = ["dep:tc_elgamal", "dep:tc_asym_encoding", "dep:tc_dh_key", "dep:tc_md", "dep:tc_sha"]
naccache-stern = ["dep:tc_naccache_stern"]
dsa = ["dep:tc_bigint", "dep:tc_dsa", "dep:tc_dsa_signer", "dep:tc_sha"]
gost3410 = ["dep:tc_bigint", "dep:tc_dsa", "dep:tc_gost3410", "dep:tc_gost3411"]
cfrg-curves = ["dep:tc_cfrg_curves", "tc_cfrg_curves/x448", "tc_cfrg_curves/ed448"]
ml-dsa = ["dep:tc_ml_dsa"]
slh-dsa = ["dep:tc_slh_dsa"]
ml-kem = ["dep:tc_ml_kem"]

# EC: the keys, then the curves each crate has; a row over EC keys takes the curves that are on
ec-key = ["dep:tc_bigint", "dep:tc_ec_core", "dep:tc_ec_key"]
fp-custom = ["ec-key", "dep:tc_fp_custom"]
fp-curve = ["ec-key", "dep:tc_fp_curve"]
f2m-custom = ["ec-key", "dep:tc_f2m_custom"]
f2m-curve = ["ec-key", "dep:tc_f2m_curve"]
ecdsa = ["ec-key", "dep:tc_dsa", "dep:tc_ecdsa_v2"]
ecnr = ["ec-key", "dep:tc_dsa", "dep:tc_ecnr"]
ecgost3410 = ["ec-key", "dep:tc_dsa", "dep:tc_ecgost3410", "dep:tc_gost3411"]
sm2 = ["fp-custom", "dep:tc_sm2", "dep:tc_dsa"]
ec-agreement = ["ec-key", "dep:tc_ec_agreement", "dep:tc_ecdh_kek"]

# Agreement, KDF, PBE, DRBG and IES
dh = ["dep:tc_bigint", "dep:tc_dh", "dep:tc_dh_key"]
kdf = ["tc_macs/hmac", "tc_macs/alloc"]
pbe = ["dep:tc_pbe", "dep:tc_block_modes"]
drbg = ["dep:tc_drbg", "tc_macs/hmac", "tc_macs/alloc"]
ies = ["dh", "tc_buffered_cipher/ies", "tc_macs/hmac", "tc_macs/alloc", "dep:tc_sha"]

[dependencies]
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
tc_aead_cipher = { version = "0.1.1", features = ["alloc"], optional = true }
tc_asn1 = "0.1.2"
tc_block_cipher = { version = "0.1.0", features = ["alloc"] }
tc_block_modes = { version = "0.1.2", features = ["alloc"], optional = true }
tc_buffered_cipher = { version = "0.2.1", features = ["alloc"] }
tc_cts_modes = { version = "0.1.0", features = ["alloc"], optional = true }
tc_constant_time = "0.1.0"
tc_zeroize = { version = "0.1.0", features = ["alloc"] }
tc_digest = { version = "0.1.1", features = ["alloc"] }

# Digest
tc_ascon_hash = { version = "0.1.0", optional = true }
tc_blake = { version = "0.1.0", optional = true }
tc_dstu7564 = { version = "0.1.0", optional = true }
tc_gost3411 = { version = "0.1.0", optional = true }
tc_md = { version = "0.1.1", optional = true }
tc_misc_digest = { version = "0.1.0", optional = true }
tc_ripemd = { version = "0.1.0", optional = true }
tc_sha = { version = "0.1.1", optional = true }
tc_skein = { version = "0.1.0", optional = true }
tc_sm3 = { version = "0.1.0", optional = true }

# XOF
tc_keccak = { version = "0.1.0", optional = true }

# Block Cipher
tc_aes = { version = "0.1.0", optional = true }
tc_block_padding = { version = "0.1.0", optional = true }
tc_des = { version = "0.1.1", optional = true }
tc_camellia = { version = "0.1.0", optional = true }
tc_aria = { version = "0.1.0", optional = true }
tc_sm4 = { version = "0.1.0", optional = true }
tc_seed = { version = "0.1.0", optional = true }
tc_dstu7624 = { version = "0.1.0", optional = true }
tc_blowfish = { version = "0.1.0", optional = true }
tc_twofish = { version = "0.1.0", optional = true }
tc_serpent = { version = "0.1.0", optional = true }
tc_cast = { version = "0.1.0", optional = true }
tc_misc_block_cipher = { version = "0.1.0", optional = true }
tc_rc_cipher = { version = "0.1.0", features = ["alloc"], optional = true }
tc_gost28147 = { version = "0.1.0", features = ["alloc"], optional = true }
tc_threefish = { version = "0.1.0", features = ["alloc"], optional = true }

# Stream cipher
tc_chacha = { version = "0.1.0", optional = true }
tc_chacha_aead = { version = "0.1.0", optional = true }
tc_ascon_aead = { version = "0.1.0", optional = true }
tc_grain128_aead = { version = "0.1.0", optional = true }
tc_sparkle_aead = { version = "0.1.0", optional = true }
tc_hc = { version = "0.1.0", optional = true }
tc_rc4_family = { version = "0.1.0", optional = true }
tc_salsa20 = { version = "0.1.0", optional = true }
tc_stream_cipher = { version = "0.1.0", optional = true }

# MAC
tc_macs = "0.1.1"
tc_gost28147_mac = { version = "0.1.0", optional = true }
tc_iso9797_mac = { version = "0.1.0", optional = true }
tc_kmac = { version = "0.1.0", optional = true }
tc_poly1305 = { version = "0.1.0", optional = true }
tc_skein_mac = { version = "0.1.0", optional = true }

# Key wrap
tc_key_wrap = "0.1.0"

# Key pair
tc_asym_cipher = "0.2.0"
tc_asym_encoding = { version = "0.2.0", optional = true }
tc_asym_iso9796 = { version = "0.2.0", optional = true }
tc_asn1_x509 = "0.1.0"
tc_rsa = { version = "0.2.0", optional = true }
tc_rsa_signer = { version = "0.1.0", path = "../../signer/tc_rsa_signer", optional = true }
tc_signer = "0.1.0"
tc_dsa = { version = "0.1.0", optional = true }
tc_ecdsa_v2 = { version = "0.1.0", path = "../../signer/tc_ecdsa_v2", optional = true }
tc_ecnr = { version = "0.1.0", path = "../../signer/tc_ecnr", optional = true }
tc_ecgost3410 = { version = "0.1.0", path = "../../signer/tc_ecgost3410", optional = true }
tc_dsa_signer = { version = "0.1.0", optional = true }
tc_gost3410 = { version = "0.1.0", path = "../../signer/tc_gost3410", optional = true }
tc_cfrg_curves = { version = "0.1.0", path = "../tc_cfrg_curves", optional = true }
tc_ml_dsa = { version = "0.1.0", path = "../../signer/tc_ml_dsa", optional = true }
tc_slh_dsa = { version = "0.1.0", path = "../../signer/tc_slh_dsa", optional = true }

# IES

# DRBG
tc_drbg = { version = "0.1.0", optional = true }

# KEM
tc_kem = { version = "0.1.0", path = "../tc_kem" }
tc_ml_kem = { version = "0.1.0", path = "../tc_ml_kem", optional = true }

# PBE
tc_pbe = { version = "0.1.0", optional = true }

# KDF
tc_kdf = "0.1.0"

# Agreement
tc_agreement = "0.1.0"
tc_bigint = { version = "0.1.0", features = ["alloc"], optional = true }
tc_dh = { version = "0.1.0", optional = true }
tc_dh_key = { version = "0.1.0", optional = true }
tc_elgamal = { version = "0.1.0", optional = true }
tc_naccache_stern = { version = "0.1.0", path = "../tc_naccache_stern", optional = true }
tc_sm2 = { version = "0.1.0", path = "../tc_sm2", optional = true }
tc_ec_key = { version = "0.1.0", optional = true }
tc_ec_core = { version = "0.1.0", optional = true }
tc_ec_agreement = { version = "0.1.0", optional = true }
tc_ecdh_kek = { version = "0.1.0", path = "../../kdf/tc_ecdh_kek", optional = true }
tc_f2m_curve = { version = "0.1.1", features = ["small-curves"], optional = true }
tc_f2m_custom = { version = "0.1.0", features = ["small-curves"], optional = true }
tc_fp_curve = { version = "0.1.1", features = ["small-curves"], optional = true }
tc_fp_custom = { version = "0.1.0", features = ["small-curves"], optional = true }

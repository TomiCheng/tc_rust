[package]
name = "tc_algo"
description = "Name- and OID-based factories for digests, MACs, ciphers, signers and more, after Bouncy Castle C#'s Org.BouncyCastle.Security."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
# Digest
sha1 = ["dep:tc_sha"]
sha224 = ["dep:tc_sha"]
sha256 = ["dep:tc_sha"]
sha384 = ["dep:tc_sha"]
sha512 = ["dep:tc_sha"]
sha512-224 = ["dep:tc_sha"]
sha512-256 = ["dep:tc_sha"]
md2 = ["dep:tc_md"]
md4 = ["dep:tc_md"]
md5 = ["dep:tc_md"]
blake2b-160 = ["dep:tc_blake"]
blake2b-256 = ["dep:tc_blake"]
blake2b-384 = ["dep:tc_blake"]
blake2b-512 = ["dep:tc_blake"]
blake2s-128 = ["dep:tc_blake"]
blake2s-160 = ["dep:tc_blake"]
blake2s-224 = ["dep:tc_blake"]
blake2s-256 = ["dep:tc_blake"]
blake3-256 = ["dep:tc_blake"]
ripemd128 = ["dep:tc_ripemd"]
ripemd160 = ["dep:tc_ripemd"]
ripemd256 = ["dep:tc_ripemd"]
ripemd320 = ["dep:tc_ripemd"]
sm3 = ["dep:tc_sm3"]
gost3411 = ["dep:tc_gost3411"]
gost3411-2012-256 = ["dep:tc_gost3411"]
gost3411-2012-512 = ["dep:tc_gost3411"]
dstu7564-256 = ["dep:tc_dstu7564"]
dstu7564-384 = ["dep:tc_dstu7564"]
dstu7564-512 = ["dep:tc_dstu7564"]
tiger = ["dep:tc_misc_digest", "tc_misc_digest/tiger"]
whirlpool = ["dep:tc_misc_digest", "tc_misc_digest/whirlpool"]
keccak-224 = ["dep:tc_keccak"]
keccak-256 = ["dep:tc_keccak"]
keccak-288 = ["dep:tc_keccak"]
keccak-384 = ["dep:tc_keccak"]
keccak-512 = ["dep:tc_keccak"]
sha3-224 = ["dep:tc_keccak"]
sha3-256 = ["dep:tc_keccak"]
sha3-384 = ["dep:tc_keccak"]
sha3-512 = ["dep:tc_keccak"]
shake128-256 = ["dep:tc_keccak"]
shake256-512 = ["dep:tc_keccak"]
ascon-hash256 = ["dep:tc_ascon_hash"]
ascon-hash = ["dep:tc_ascon_hash", "tc_ascon_hash/legacy"]
ascon-hasha = ["dep:tc_ascon_hash", "tc_ascon_hash/legacy"]
isap = ["dep:tc_ascon_hash", "tc_ascon_hash/legacy"]
skein-256-128 = ["dep:tc_skein"]
skein-256-160 = ["dep:tc_skein"]
skein-256-224 = ["dep:tc_skein"]
skein-256-256 = ["dep:tc_skein"]
skein-512-128 = ["dep:tc_skein"]
skein-512-160 = ["dep:tc_skein"]
skein-512-224 = ["dep:tc_skein"]
skein-512-256 = ["dep:tc_skein"]
skein-512-384 = ["dep:tc_skein"]
skein-512-512 = ["dep:tc_skein"]
skein-1024-384 = ["dep:tc_skein"]
skein-1024-512 = ["dep:tc_skein"]
skein-1024-1024 = ["dep:tc_skein"]
photon-beetle = ["dep:tc_misc_digest", "tc_misc_digest/photon-beetle"]
esch-256 = ["dep:tc_misc_digest", "tc_misc_digest/sparkle"]
esch-384 = ["dep:tc_misc_digest", "tc_misc_digest/sparkle"]
xoodyak = ["dep:tc_misc_digest", "tc_misc_digest/xoodyak"]
haraka-256 = ["dep:tc_misc_digest", "tc_misc_digest/haraka"]
haraka-512 = ["dep:tc_misc_digest", "tc_misc_digest/haraka"]
null-digest = ["tc_digest/alloc"]

# XOF
shake128 = ["dep:tc_keccak"]
shake256 = ["dep:tc_keccak"]
cshake128 = ["dep:tc_keccak"]
cshake256 = ["dep:tc_keccak"]
tuplehash128 = ["dep:tc_keccak"]
tuplehash256 = ["dep:tc_keccak"]
parallelhash128 = ["dep:tc_keccak"]
parallelhash256 = ["dep:tc_keccak"]
blake2xs = ["dep:tc_blake"]
blake3 = ["dep:tc_blake"]
ascon-xof128 = ["dep:tc_ascon_hash"]
ascon-cxof128 = ["dep:tc_ascon_hash"]
ascon-xof = ["dep:tc_ascon_hash", "tc_ascon_hash/legacy"]
ascon-xofa = ["dep:tc_ascon_hash", "tc_ascon_hash/legacy"]

# Block Cipher
aes = ["dep:tc_aes", "dep:tc_aead_cipher", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]

des = ["dep:tc_des", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
desede = ["dep:tc_des", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
camellia = ["dep:tc_camellia", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
aria = ["dep:tc_aria", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
sm4 = ["dep:tc_sm4", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
seed = ["dep:tc_seed", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
blowfish = ["dep:tc_blowfish", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
twofish = ["dep:tc_twofish", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
serpent = ["dep:tc_serpent", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
tnepres = ["dep:tc_serpent", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
cast5 = ["dep:tc_cast", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
cast6 = ["dep:tc_cast", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
idea = ["dep:tc_misc_block_cipher", "tc_misc_block_cipher/idea", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
noekeon = ["dep:tc_misc_block_cipher", "tc_misc_block_cipher/noekeon", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
rijndael = ["dep:tc_misc_block_cipher", "tc_misc_block_cipher/rijndael", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
skipjack = ["dep:tc_misc_block_cipher", "tc_misc_block_cipher/skipjack", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
tea = ["dep:tc_misc_block_cipher", "tc_misc_block_cipher/tea", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
xtea = ["dep:tc_misc_block_cipher", "tc_misc_block_cipher/tea", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
rc2 = ["dep:tc_rc_cipher", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
rc5 = ["dep:tc_rc_cipher", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
rc5-64 = ["dep:tc_rc_cipher", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
rc6 = ["dep:tc_rc_cipher", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
gost28147 = ["dep:tc_gost28147", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
threefish-256 = ["dep:tc_threefish", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
threefish-512 = ["dep:tc_threefish", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]
threefish-1024 = ["dep:tc_threefish", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_block_padding", "tc_block_padding/rand_core", "dep:tc_cts_modes"]

# Stream cipher
chacha = ["dep:tc_chacha", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
xchacha20 = ["dep:tc_chacha", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
rc4 = ["dep:tc_rc4_family", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
vmpc = ["dep:tc_rc4_family", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
vmpc-ksa3 = ["dep:tc_rc4_family", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
isaac = ["dep:tc_rc4_family", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
salsa20 = ["dep:tc_salsa20", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
xsalsa20 = ["dep:tc_salsa20", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
hc128 = ["dep:tc_hc", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]
hc256 = ["dep:tc_hc", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes"]

# MAC
hmac-sha256 = ["sha256", "dep:tc_block_cipher", "tc_macs/hmac", "tc_macs/alloc"]

# Key wrap
aes-wrap = ["aes", "tc_key_wrap/rfc3394"]

# Key pair
rsa = ["dep:tc_asn1_x509", "dep:tc_asym_encoding", "dep:tc_rsa", "dep:tc_rsa_signer", "dep:tc_sha"]

# Agreement
dh = ["dep:tc_bigint", "dep:tc_dh", "dep:tc_dh_key"]

# KDF
hkdf = ["tc_macs/hmac", "tc_macs/alloc", "dep:tc_sha"]
hkdf-sha256 = ["hkdf"]
hkdf-sha384 = ["hkdf"]
hkdf-sha512 = ["hkdf"]

# PBE
pbe-aes = ["aes", "dep:tc_pbe", "dep:tc_sha"]

# KEM
ml-kem = ["dep:tc_ml_kem"]

# DRBG
drbg-hmac-sha256 = ["hmac-sha256", "dep:tc_drbg"]

# IES
ies = ["dh", "dep:tc_block_cipher", "dep:tc_ies", "tc_macs/hmac", "tc_macs/alloc", "dep:tc_sha"]

[dependencies]
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
tc_aead_cipher = { version = "0.1.0", features = ["alloc"], optional = true }
tc_asn1 = "0.1.2"
tc_block_cipher = { version = "0.1.0", features = ["alloc"], optional = true }
tc_block_modes = { version = "0.1.2", features = ["alloc"], optional = true }
tc_buffered_cipher = { version = "0.2.0", features = ["alloc"] }
tc_cts_modes = { version = "0.1.0", path = "../tc_cts_modes", features = ["alloc"], optional = true }
tc_constant_time = "0.1.0"
tc_zeroize = { version = "0.1.0", features = ["alloc"] }
tc_digest = "0.1.1"

# Digest
tc_ascon_hash = { version = "0.1.0", optional = true }
tc_blake = { version = "0.1.0", optional = true }
tc_dstu7564 = { version = "0.1.0", optional = true }
tc_gost3411 = { version = "0.1.0", optional = true }
tc_md = { version = "0.1.1", optional = true }
tc_misc_digest = { version = "0.1.0", optional = true }
tc_ripemd = { version = "0.1.0", optional = true }
tc_sha = { version = "0.1.1", optional = true }
tc_skein = { version = "0.1.0", optional = true }
tc_sm3 = { version = "0.1.0", optional = true }

# XOF
tc_keccak = { version = "0.1.0", optional = true }

# Block Cipher
tc_aes = { version = "0.1.0", optional = true }
tc_block_padding = { version = "0.1.0", optional = true }
tc_des = { version = "0.1.1", optional = true }
tc_camellia = { version = "0.1.0", optional = true }
tc_aria = { version = "0.1.0", optional = true }
tc_sm4 = { version = "0.1.0", optional = true }
tc_seed = { version = "0.1.0", optional = true }
tc_blowfish = { version = "0.1.0", optional = true }
tc_twofish = { version = "0.1.0", optional = true }
tc_serpent = { version = "0.1.0", optional = true }
tc_cast = { version = "0.1.0", optional = true }
tc_misc_block_cipher = { version = "0.1.0", optional = true }
tc_rc_cipher = { version = "0.1.0", features = ["alloc"], optional = true }
tc_gost28147 = { version = "0.1.0", features = ["alloc"], optional = true }
tc_threefish = { version = "0.1.0", features = ["alloc"], optional = true }

# Stream cipher
tc_chacha = { version = "0.1.0", optional = true }
tc_hc = { version = "0.1.0", optional = true }
tc_rc4_family = { version = "0.1.0", optional = true }
tc_salsa20 = { version = "0.1.0", optional = true }
tc_stream_cipher = { version = "0.1.0", optional = true }

# MAC
tc_macs = "0.1.1"

# Key wrap
tc_key_wrap = "0.1.0"

# Key pair
tc_asym_cipher = "0.2.0"
tc_asym_encoding = { version = "0.2.0", optional = true }
tc_asn1_x509 = { version = "0.1.0", optional = true }
tc_rsa = { version = "0.2.0", optional = true }
tc_rsa_signer = { version = "0.1.0", path = "../../signer/tc_rsa_signer", optional = true }
tc_signer = { version = "0.1.0", path = "../../signer/tc_signer" }

# IES
tc_ies = { version = "0.1.0", path = "../../ies/tc_ies", optional = true }

# DRBG
tc_drbg = { version = "0.1.0", path = "../tc_drbg", optional = true }

# KEM
tc_kem = { version = "0.1.0", path = "../tc_kem" }
tc_ml_kem = { version = "0.1.0", path = "../tc_ml_kem", optional = true }

# PBE
tc_pbe = { version = "0.1.0", path = "../../kdf/tc_pbe", optional = true }

# KDF
tc_kdf = { version = "0.1.0", path = "../../kdf/tc_kdf" }

# Agreement
tc_agreement = { version = "0.1.0", path = "../agreement/tc_agreement" }
tc_bigint = { version = "0.1.0", features = ["alloc"], optional = true }
tc_dh = { version = "0.1.0", path = "../agreement/tc_dh", optional = true }
tc_dh_key = { version = "0.1.0", path = "../tc_dh_key", optional = true }

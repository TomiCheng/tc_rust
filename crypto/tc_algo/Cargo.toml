[package]
name = "tc_algo"
description = "Name- and OID-based factories for digests, MACs, ciphers, signers and more, after Bouncy Castle C#'s Org.BouncyCastle.Security."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
# Digest
sha1 = ["dep:tc_sha", "dep:tc_digest"]
sha224 = ["dep:tc_sha", "dep:tc_digest"]
sha256 = ["dep:tc_sha", "dep:tc_digest"]
sha384 = ["dep:tc_sha", "dep:tc_digest"]
sha512 = ["dep:tc_sha", "dep:tc_digest"]
sha512-224 = ["dep:tc_sha", "dep:tc_digest"]
sha512-256 = ["dep:tc_sha", "dep:tc_digest"]
md2 = ["dep:tc_md", "dep:tc_digest"]
md4 = ["dep:tc_md", "dep:tc_digest"]
md5 = ["dep:tc_md", "dep:tc_digest"]
blake2b-160 = ["dep:tc_blake", "dep:tc_digest"]
blake2b-256 = ["dep:tc_blake", "dep:tc_digest"]
blake2b-384 = ["dep:tc_blake", "dep:tc_digest"]
blake2b-512 = ["dep:tc_blake", "dep:tc_digest"]
blake2s-128 = ["dep:tc_blake", "dep:tc_digest"]
blake2s-160 = ["dep:tc_blake", "dep:tc_digest"]
blake2s-224 = ["dep:tc_blake", "dep:tc_digest"]
blake2s-256 = ["dep:tc_blake", "dep:tc_digest"]
blake3-256 = ["dep:tc_blake", "dep:tc_digest"]
ripemd128 = ["dep:tc_ripemd", "dep:tc_digest"]
ripemd160 = ["dep:tc_ripemd", "dep:tc_digest"]
ripemd256 = ["dep:tc_ripemd", "dep:tc_digest"]
ripemd320 = ["dep:tc_ripemd", "dep:tc_digest"]
sm3 = ["dep:tc_sm3", "dep:tc_digest"]
gost3411 = ["dep:tc_gost3411", "dep:tc_digest"]
gost3411-2012-256 = ["dep:tc_gost3411", "dep:tc_digest"]
gost3411-2012-512 = ["dep:tc_gost3411", "dep:tc_digest"]
dstu7564-256 = ["dep:tc_dstu7564", "dep:tc_digest"]
dstu7564-384 = ["dep:tc_dstu7564", "dep:tc_digest"]
dstu7564-512 = ["dep:tc_dstu7564", "dep:tc_digest"]
tiger = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/tiger"]
whirlpool = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/whirlpool"]
keccak-224 = ["dep:tc_keccak", "dep:tc_digest"]
keccak-256 = ["dep:tc_keccak", "dep:tc_digest"]
keccak-288 = ["dep:tc_keccak", "dep:tc_digest"]
keccak-384 = ["dep:tc_keccak", "dep:tc_digest"]
keccak-512 = ["dep:tc_keccak", "dep:tc_digest"]
sha3-224 = ["dep:tc_keccak", "dep:tc_digest"]
sha3-256 = ["dep:tc_keccak", "dep:tc_digest"]
sha3-384 = ["dep:tc_keccak", "dep:tc_digest"]
sha3-512 = ["dep:tc_keccak", "dep:tc_digest"]
shake128-256 = ["dep:tc_keccak", "dep:tc_digest"]
shake256-512 = ["dep:tc_keccak", "dep:tc_digest"]
ascon-hash256 = ["dep:tc_ascon_hash", "dep:tc_digest"]
ascon-hash = ["dep:tc_ascon_hash", "dep:tc_digest", "tc_ascon_hash/legacy"]
ascon-hasha = ["dep:tc_ascon_hash", "dep:tc_digest", "tc_ascon_hash/legacy"]
isap = ["dep:tc_ascon_hash", "dep:tc_digest", "tc_ascon_hash/legacy"]
skein-256-128 = ["dep:tc_skein", "dep:tc_digest"]
skein-256-160 = ["dep:tc_skein", "dep:tc_digest"]
skein-256-224 = ["dep:tc_skein", "dep:tc_digest"]
skein-256-256 = ["dep:tc_skein", "dep:tc_digest"]
skein-512-128 = ["dep:tc_skein", "dep:tc_digest"]
skein-512-160 = ["dep:tc_skein", "dep:tc_digest"]
skein-512-224 = ["dep:tc_skein", "dep:tc_digest"]
skein-512-256 = ["dep:tc_skein", "dep:tc_digest"]
skein-512-384 = ["dep:tc_skein", "dep:tc_digest"]
skein-512-512 = ["dep:tc_skein", "dep:tc_digest"]
skein-1024-384 = ["dep:tc_skein", "dep:tc_digest"]
skein-1024-512 = ["dep:tc_skein", "dep:tc_digest"]
skein-1024-1024 = ["dep:tc_skein", "dep:tc_digest"]
photon-beetle = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/photon-beetle"]
esch-256 = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/sparkle"]
esch-384 = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/sparkle"]
xoodyak = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/xoodyak"]
haraka-256 = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/haraka"]
haraka-512 = ["dep:tc_misc_digest", "dep:tc_digest", "tc_misc_digest/haraka"]
null-digest = ["dep:tc_digest", "tc_digest/alloc"]

# XOF
shake128 = ["dep:tc_keccak", "dep:tc_digest"]
shake256 = ["dep:tc_keccak", "dep:tc_digest"]
cshake128 = ["dep:tc_keccak", "dep:tc_digest"]
cshake256 = ["dep:tc_keccak", "dep:tc_digest"]
tuplehash128 = ["dep:tc_keccak", "dep:tc_digest"]
tuplehash256 = ["dep:tc_keccak", "dep:tc_digest"]
parallelhash128 = ["dep:tc_keccak", "dep:tc_digest"]
parallelhash256 = ["dep:tc_keccak", "dep:tc_digest"]
blake2xs = ["dep:tc_blake", "dep:tc_digest"]
blake3 = ["dep:tc_blake", "dep:tc_digest"]
ascon-xof128 = ["dep:tc_ascon_hash", "dep:tc_digest"]
ascon-cxof128 = ["dep:tc_ascon_hash", "dep:tc_digest"]
ascon-xof = ["dep:tc_ascon_hash", "dep:tc_digest", "tc_ascon_hash/legacy"]
ascon-xofa = ["dep:tc_ascon_hash", "dep:tc_digest", "tc_ascon_hash/legacy"]

# Block Cipher
aes = ["dep:tc_aes", "dep:tc_aead_cipher", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_buffered_cipher"]

# Stream cipher
chacha = ["dep:tc_chacha", "dep:tc_stream_cipher", "dep:tc_block_cipher", "dep:tc_block_modes", "dep:tc_buffered_cipher"]

# MAC
hmac-sha256 = ["sha256", "dep:tc_block_cipher", "dep:tc_macs", "tc_macs/hmac", "tc_macs/alloc"]

# Key wrap
aes-wrap = ["aes", "dep:tc_key_wrap", "tc_key_wrap/rfc3394"]

# Key pair
rsa = ["dep:tc_asn1_x509", "dep:tc_asym_cipher", "dep:tc_asym_encoding", "dep:tc_buffered_cipher", "dep:tc_rsa", "dep:tc_rsa_signer", "dep:tc_sha", "dep:tc_signer"]

# Agreement
dh = ["dep:tc_agreement", "dep:tc_asym_cipher", "dep:tc_bigint", "dep:tc_dh", "dep:tc_dh_key"]

# KDF
hkdf = ["dep:tc_digest", "dep:tc_kdf", "dep:tc_macs", "tc_macs/hmac", "tc_macs/alloc", "dep:tc_sha"]
hkdf-sha256 = ["hkdf"]
hkdf-sha384 = ["hkdf"]
hkdf-sha512 = ["hkdf"]

# PBE
pbe-aes = ["aes", "dep:tc_pbe", "dep:tc_sha"]

# KEM
ml-kem = ["dep:tc_asym_cipher", "dep:tc_kem", "dep:tc_ml_kem"]

# DRBG
drbg-hmac-sha256 = ["hmac-sha256", "dep:tc_drbg"]

# IES
ies = ["dh", "dep:tc_block_cipher", "dep:tc_ies", "dep:tc_kdf", "dep:tc_macs", "tc_macs/hmac", "tc_macs/alloc", "dep:tc_sha"]

[dependencies]
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
tc_aead_cipher = { version = "0.1.0", features = ["alloc"], optional = true }
tc_asn1 = "0.1.2"
tc_block_cipher = { version = "0.1.0", features = ["alloc"], optional = true }
tc_block_modes = { version = "0.1.1", features = ["alloc"], optional = true }
tc_buffered_cipher = { version = "0.1.1", features = ["alloc"], optional = true }
tc_constant_time = "0.1.0"
tc_zeroize = { version = "0.1.0", features = ["alloc"] }
tc_digest = { version = "0.1.1", optional = true }

# Digest
tc_ascon_hash = { version = "0.1.0", optional = true }
tc_blake = { version = "0.1.0", optional = true }
tc_dstu7564 = { version = "0.1.0", optional = true }
tc_gost3411 = { version = "0.1.0", optional = true }
tc_md = { version = "0.1.1", optional = true }
tc_misc_digest = { version = "0.1.0", optional = true }
tc_ripemd = { version = "0.1.0", optional = true }
tc_sha = { version = "0.1.1", optional = true }
tc_skein = { version = "0.1.0", optional = true }
tc_sm3 = { version = "0.1.0", optional = true }

# XOF
tc_keccak = { version = "0.1.0", optional = true }

# Block Cipher
tc_aes = { version = "0.1.0", optional = true }

# Stream cipher
tc_chacha = { version = "0.1.0", optional = true }
tc_stream_cipher = { version = "0.1.0", optional = true }

# MAC
tc_macs = { version = "0.1.1", optional = true }

# Key wrap
tc_key_wrap = { version = "0.1.0", optional = true }

# Key pair
tc_asym_cipher = { version = "0.1.0", optional = true }
tc_asym_encoding = { version = "0.1.0", optional = true }
tc_asn1_x509 = { version = "0.1.0", optional = true }
tc_rsa = { version = "0.1.0", optional = true }
tc_rsa_signer = { version = "0.1.0", path = "../../signer/tc_rsa_signer", optional = true }
tc_signer = { version = "0.1.0", path = "../../signer/tc_signer", optional = true }

# IES
tc_ies = { version = "0.1.0", path = "../../ies/tc_ies", optional = true }

# DRBG
tc_drbg = { version = "0.1.0", path = "../tc_drbg", optional = true }

# KEM
tc_kem = { version = "0.1.0", path = "../tc_kem", optional = true }
tc_ml_kem = { version = "0.1.0", path = "../tc_ml_kem", optional = true }

# PBE
tc_pbe = { version = "0.1.0", path = "../../kdf/tc_pbe", optional = true }

# KDF
tc_kdf = { version = "0.1.0", path = "../../kdf/tc_kdf", optional = true }

# Agreement
tc_agreement = { version = "0.1.0", path = "../agreement/tc_agreement", optional = true }
tc_bigint = { version = "0.1.0", features = ["alloc"], optional = true }
tc_dh = { version = "0.1.0", path = "../agreement/tc_dh", optional = true }
tc_dh_key = { version = "0.1.0", path = "../tc_dh_key", optional = true }

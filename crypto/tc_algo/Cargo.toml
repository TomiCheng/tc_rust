[package]
name = "tc_algo"
description = "Name- and OID-based factories for digests, MACs, ciphers, signers and more, after Bouncy Castle C#'s Org.BouncyCastle.Security."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
# Broken or discouraged digests stay out of the default: MD2, MD4, MD5 and SHA-1. The family
# features still include them.
default = [
    "sha224",
    "sha256",
    "sha384",
    "sha512",
    "sha512-224",
    "sha512-256",
    "sha3-224",
    "sha3-256",
    "sha3-384",
    "sha3-512",
    "keccak-224",
    "keccak-256",
    "keccak-288",
    "keccak-384",
    "keccak-512",
    "shake128",
    "shake256",
]
md = ["md2", "md4", "md5"]
md2 = []
md4 = []
md5 = []
sha = ["sha1", "sha224", "sha256", "sha384", "sha512", "sha512-224", "sha512-256"]
sha1 = []
sha224 = []
sha256 = ["dep:tc_sha"]
sha384 = []
sha512 = []
sha512-224 = []
sha512-256 = []
sha3 = ["sha3-224", "sha3-256", "sha3-384", "sha3-512"]
sha3-224 = []
sha3-256 = []
sha3-384 = []
sha3-512 = []
keccak = ["keccak-224", "keccak-256", "keccak-288", "keccak-384", "keccak-512"]
keccak-224 = []
keccak-256 = []
keccak-288 = []
keccak-384 = []
keccak-512 = []
# SHAKE as a fixed-length digest: SHAKE128 gives 256 bits and SHAKE256 512 bits, as in Bouncy Castle
shake = ["shake128", "shake256"]
shake128 = []
shake256 = []

[dependencies]
tc_asn1 = "0.1.2"
tc_digest = "0.1.1"
tc_sha = { version = "0.1.1", optional = true }

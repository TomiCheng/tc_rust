[package]
name = "tc_operator"
description = "Signature and verifier factories over AlgorithmIdentifier, after Bouncy Castle's Crypto.Operators."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_asn1_x509 = { version = "0.1.0", path = "../../asn1/tc_asn1_x509" }
tc_signer = { version = "0.1.0", path = "../../signer/tc_signer" }
tc_security = { version = "0.1.0", path = "../tc_security" }
tc_asn1 = "0.1.1"
tc_digest = "0.1.0"
tc_macs = "0.1.0"
tc_asn1_pkcs = { version = "0.1.0", path = "../../asn1/tc_asn1_pkcs" }
tc_asn1_cms = { version = "0.1.0", path = "../../asn1/tc_asn1_cms" }
tc_buffered_cipher = { version = "0.1.1", features = ["alloc"] }

[package]
name = "tc_cfrg_curves"
description = "The CFRG curves: X25519 and X448 key agreement and Ed25519 and Ed448 signatures, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
std = ["tc_runtime?/std"]
x86 = ["dep:tc_runtime"]
x25519 = []
x448 = []
ed25519 = ["dep:tc_digest", "dep:tc_sha"]
ed448 = ["dep:tc_digest"]

[dependencies]
rand_core = { workspace = true }
tc_constant_time = "0.1.0"
tc_digest = { version = "0.1.0", optional = true }
# tc_keccak = { version = "0.1.0", path = "../digest/tc_keccak", optional = true }
tc_sha = { version = "0.1.0", optional = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = { version = "0.1.0", optional = true }

[dev-dependencies]
criterion = { workspace = true }
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_modular = { version = "0.1.0", features = ["alloc"] }

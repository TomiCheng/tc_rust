[package]
name = "tc_cfrg_curves"
description = "The CFRG curves: X25519 and X448 key agreement and Ed25519 and Ed448 signatures, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
x448 = []
ed448 = []

[dependencies]
rand_core = { workspace = true }
tc_agreement = { version = "0.1.0", path = "../agreement/tc_agreement" }
tc_asym_cipher = "0.1.0"
tc_constant_time = "0.1.0"
tc_digest = "0.1.0"
# tc_keccak = { version = "0.1.0", path = "../digest/tc_keccak", optional = true }
tc_sha = "0.1.0"
tc_signer = { version = "0.1.0", path = "../../signer/tc_signer" }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"

[dev-dependencies]
criterion = { workspace = true }
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_modular = { version = "0.1.0", features = ["alloc"] }

[package]
name = "tc_ec_key"
description = "Elliptic-curve domain parameters and keys, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
rand_core = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_ec_core_v2 = { version = "0.1.0", path = "../../math/tc_ec_core_v2" }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
tc_f2m_curve_v2 = { version = "0.1.0", path = "../../math/tc_f2m_curve_v2" }
tc_fp_curve_v2 = { version = "0.1.0", path = "../../math/tc_fp_curve_v2" }

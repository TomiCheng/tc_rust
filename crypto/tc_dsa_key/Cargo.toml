[package]
name = "tc_dsa_key"
description = "DSA parameters, keys and generators (FIPS 186-2 and 186-3), ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
rand_core = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_digest = "0.1.0"
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_prime = { version = "0.1.0", features = ["alloc"] }
tc_sha = "0.1.1"
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
rand_core = { workspace = true }

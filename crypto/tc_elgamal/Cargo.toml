[package]
name = "tc_elgamal"
description = "ElGamal encryption over the Diffie-Hellman group, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
rand_core = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_dh_key = { version = "0.1.0", path = "../tc_dh_key" }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
tc_asym_encoding = "0.1.0"

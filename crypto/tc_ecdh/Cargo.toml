[package]
name = "tc_ecdh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ECDH agreements over fixed-width short-Weierstrass curves."

[dependencies]
tc_bigint = { version = "0.1.0", path = "../../math/tc_bigint", default-features = false, features = ["alloc"] }
tc_ec_core = { version = "0.1.0", path = "../../math/tc_ec_core" }

[dev-dependencies]
tc_f2m_custom = { version = "0.1.0", path = "../../math/tc_f2m_custom" }
tc_fp_curve = { version = "0.1.0", path = "../../math/tc_fp_curve" }
tc_fp_custom = { version = "0.1.0", path = "../../math/tc_fp_custom" }

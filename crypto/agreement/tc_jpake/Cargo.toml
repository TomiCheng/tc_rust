[package]
name = "tc_jpake"
description = "J-PAKE password-authenticated key exchange, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
rand_core = { workspace = true }
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_constant_time = "0.1.0"
tc_digest = "0.1.0"
tc_macs = { version = "0.1.0", features = ["alloc", "hmac"] }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_prime = { version = "0.1.0", features = ["alloc"] }
tc_sha = "0.1.1"
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
rand = { workspace = true }

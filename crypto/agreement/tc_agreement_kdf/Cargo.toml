[package]
name = "tc_agreement_kdf"
description = "Key agreement followed by the RFC 5753 KEK derivation, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_agreement = { version = "0.1.0", path = "../tc_agreement" }
tc_asn1_x509 = { version = "0.1.0", path = "../../../asn1/tc_asn1_x509" }
tc_ecdh_kek = { version = "0.1.0", path = "../../../kdf/tc_ecdh_kek" }
tc_kdf = { version = "0.1.0", path = "../../../kdf/tc_kdf" }
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
rand = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_ec_core = "0.1.0"
tc_ec_key = { version = "0.1.0", path = "../../tc_ec_key" }
tc_ecdh_v2 = { version = "0.1.0", path = "../tc_ecdh_v2" }
tc_ecmqv = { version = "0.1.0", path = "../tc_ecmqv" }
tc_f2m_curve = "0.1.0"
tc_fp_curve = "0.1.0"
tc_sha = "0.1.1"

[package]
name = "tc_ecdh_v2"
description = "ECDH key agreement over short-Weierstrass curves, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_agreement = { version = "0.1.0", path = "../tc_agreement" }
tc_bigint = { version = "0.1.0", features = ["alloc"] }
tc_ec_core_v2 = { version = "0.1.0", path = "../../../math/tc_ec_core_v2" }
tc_ec_key = { version = "0.1.0", path = "../../tc_ec_key" }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_f2m_curve_v2 = { version = "0.1.0", path = "../../../math/tc_f2m_curve_v2" }
tc_fp_curve_v2 = { version = "0.1.0", path = "../../../math/tc_fp_curve_v2" }
tc_fp_custom_v2 = { version = "0.1.0", path = "../../../math/tc_fp_custom_v2", features = ["small-curves"] }

[package]
name = "tc_srp6"
description = "SRP-6a password-authenticated key exchange, ported from Bouncy Castle C#."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
rand_core = { workspace = true }
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_constant_time = "0.1.0"
tc_digest = "0.1.0"
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
rand = { workspace = true }
tc_asym_cipher = "0.1.0"
tc_dh_key = { version = "0.1.0", path = "../../tc_dh_key" }
tc_sha = "0.1.1"

[package]
name = "tc_security"
description = "Name-based cipher, MAC and digest factories, after Bouncy Castle's Org.BouncyCastle.Security."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 已被攻破或不建議使用的不在預設裡，要用時明確開啟：MD2、MD4、MD5、SHA-1（碰撞已可實作）、
# RC2 與 RC5（8 bytes 區塊，RC2 有 related-key 攻擊，RC5-32/12 可被差分分析）。
# 家族 feature（md、sha、rc）照樣包含它們。
default = [
    "sha224",
    "sha256",
    "sha384",
    "sha512",
    "sha512-224",
    "sha512-256",
    "aes",
    "aria",
    "rc6",
    "chacha",
    "rsa",
    "x25519",
    "x448",
    "ed25519",
    "ed448",
]
md = ["md2", "md4", "md5"]
md2 = ["dep:tc_md"]
md4 = ["dep:tc_md"]
md5 = ["dep:tc_md"]
sha = ["sha1", "sha224", "sha256", "sha384", "sha512", "sha512-224", "sha512-256"]
sha1 = ["dep:tc_sha"]
sha224 = ["dep:tc_sha"]
sha256 = ["dep:tc_sha"]
sha384 = ["dep:tc_sha"]
sha512 = ["dep:tc_sha"]
sha512-224 = ["dep:tc_sha"]
sha512-256 = ["dep:tc_sha"]
aes = ["dep:tc_aes"]
aria = ["dep:tc_aria"]
rc = ["rc2", "rc5", "rc6"]
rc2 = ["dep:tc_rc_cipher"]
# RC5-32 與 RC5-64
rc5 = ["dep:tc_rc_cipher"]
rc6 = ["dep:tc_rc_cipher"]
# ChaCha、ChaCha7539（RFC 8439）與 XChaCha20
chacha = ["dep:tc_chacha"]
# Ascon-AEAD128 與 Ascon v1.2 的 AEAD。BC 的工廠沒有，名稱是自訂的，所以預設不開
ascon = ["dep:tc_ascon_aead"]
# RSA 的金鑰參數，之後接上 RSA 的 cipher 與金鑰對產生器
rsa = ["dep:tc_rsa", "dep:tc_asym_cipher", "dep:tc_asym_encoding"]
iso9796 = ["rsa", "dep:tc_asym_iso9796"]
# CFRG 曲線的金鑰對，之後接上 agreement 與 signer
x25519 = ["dep:tc_cfrg_curves", "dep:tc_asym_cipher"]
x448 = ["dep:tc_cfrg_curves", "tc_cfrg_curves/x448", "dep:tc_asym_cipher"]
ed25519 = ["dep:tc_cfrg_curves", "dep:tc_asym_cipher"]
ed448 = ["dep:tc_cfrg_curves", "tc_cfrg_curves/ed448", "dep:tc_asym_cipher"]
# 引擎改用 RustCrypto 的實作：AES 沒有 AES-NI 時也是常數時間，ARIA 改走 RustCrypto，RC 系列只影響 RC2。
# 只作用在已開啟的演算法，不會連帶開啟它們。
rustcrypto = [
    "tc_aes?/rustcrypto",
    "tc_aria?/rustcrypto",
    "tc_rc_cipher?/rustcrypto",
    "tc_chacha?/rustcrypto",
    "tc_rsa?/rustcrypto",
    "tc_asym_iso9796?/rustcrypto",
]

[dependencies]
tc_aead_cipher = { version = "0.1.0", features = ["alloc"] }
tc_block_cipher = "0.1.0"
tc_block_modes = { version = "0.1.0", features = ["alloc"] }
tc_buffered_cipher = { version = "0.1.1", features = ["alloc"] }
tc_block_padding = { version = "0.1.0", features = ["rand_core"] }
tc_agreement = { version = "0.1.0", path = "../agreement/tc_agreement" }
tc_asn1 = "0.1.1"
tc_digest = "0.1.0"
tc_key_wrap = { version = "0.1.0", features = ["rfc3394"] }
tc_macs = { version = "0.1.0", features = ["hmac", "cbc-mac", "alloc"] }
tc_md = { version = "0.1.1", optional = true }
tc_rc_cipher = { version = "0.1.0", optional = true }
tc_sha = { version = "0.1.1", optional = true }
tc_aes = { version = "0.1.0", optional = true }
tc_aria = { version = "0.1.0", optional = true }
tc_ascon_aead = { version = "0.1.0", optional = true }
tc_chacha = { version = "0.1.0", optional = true }
tc_rsa = { version = "0.1.0", optional = true }
tc_asym_cipher = { version = "0.1.0", optional = true }
tc_asym_encoding = { version = "0.1.0", optional = true }
tc_asym_iso9796 = { version = "0.1.0", optional = true }
tc_cfrg_curves = { version = "0.1.0", path = "../tc_cfrg_curves", optional = true }
tc_stream_cipher = "0.1.0"
tc_zeroize = "0.1.0"
rand = { workspace = true }

[dev-dependencies]
tc_asym_cipher = "0.1.0"

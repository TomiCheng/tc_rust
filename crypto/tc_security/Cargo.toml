[package]
name = "tc_security"
description = "Name-based cipher, MAC and digest factories, after Bouncy Castle's Org.BouncyCastle.Security."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# 已被攻破或不建議使用的不在預設裡，要用時明確開啟：MD2、MD4、MD5、SHA-1（碰撞已可實作）、
# RC2 與 RC5（8 bytes 區塊，RC2 有 related-key 攻擊，RC5-32/12 可被差分分析）、
# RC4（keystream 有偏差）、VMPC 與 HC（以秘密狀態查表，有 cache-timing 側通道）、
# DES（56 bits 金鑰可暴力破解）與 Triple DES（8 bytes 區塊，NIST 已不准用來加密）、
# 二元體的 EC 曲線（NIST SP 800-186 已列為 legacy）與強度不足的 EC 小曲線。
# 家族 feature（md、sha、sha3、keccak、shake、rc）照樣包含它們。
default = [
    "sha224",
    "sha256",
    "sha384",
    "sha512",
    "sha512-224",
    "sha512-256",
    "sha3-224",
    "sha3-256",
    "sha3-384",
    "sha3-512",
    "keccak-224",
    "keccak-256",
    "keccak-288",
    "keccak-384",
    "keccak-512",
    "shake128",
    "shake256",
    "aes",
    "aria",
    "camellia",
    "rc6",
    "chacha",
    "salsa20",
    "rsa",
    "x25519",
    "x448",
    "ed25519",
    "ed448",
    "ec",
]
md = ["md2", "md4", "md5"]
md2 = ["dep:tc_md"]
md4 = ["dep:tc_md"]
md5 = ["dep:tc_md"]
sha = ["sha1", "sha224", "sha256", "sha384", "sha512", "sha512-224", "sha512-256"]
sha1 = ["dep:tc_sha"]
sha224 = ["dep:tc_sha"]
sha256 = ["dep:tc_sha"]
sha384 = ["dep:tc_sha"]
sha512 = ["dep:tc_sha"]
sha512-224 = ["dep:tc_sha"]
sha512-256 = ["dep:tc_sha"]
# FIPS 202 的 SHA-3
sha3 = ["sha3-224", "sha3-256", "sha3-384", "sha3-512"]
sha3-224 = ["dep:tc_keccak"]
sha3-256 = ["dep:tc_keccak"]
sha3-384 = ["dep:tc_keccak"]
sha3-512 = ["dep:tc_keccak"]
# 原始 Keccak，SHA-3 標準化前的版本（Ethereum 用的 Keccak-256 就是它）
keccak = ["keccak-224", "keccak-256", "keccak-288", "keccak-384", "keccak-512"]
keccak-224 = ["dep:tc_keccak"]
keccak-256 = ["dep:tc_keccak"]
keccak-288 = ["dep:tc_keccak"]
keccak-384 = ["dep:tc_keccak"]
keccak-512 = ["dep:tc_keccak"]
# SHAKE 當固定長度的 digest：SHAKE128 輸出 256 bits、SHAKE256 輸出 512 bits，同 BC
shake = ["shake128", "shake256"]
shake128 = ["dep:tc_keccak"]
shake256 = ["dep:tc_keccak"]
aes = ["dep:tc_aes"]
aria = ["dep:tc_aria"]
camellia = ["dep:tc_camellia"]
rc = ["rc2", "rc5", "rc6"]
rc2 = ["dep:tc_rc_cipher"]
# RC5-32 與 RC5-64
rc5 = ["dep:tc_rc_cipher"]
rc6 = ["dep:tc_rc_cipher"]
# DES 與 Triple DES（DESede），產生金鑰時同 BC 設 odd parity、避開弱金鑰與重複的分段
des = ["dep:tc_des"]
desede = ["dep:tc_des"]
# ChaCha、ChaCha7539（RFC 8439）與 XChaCha20
chacha = ["dep:tc_chacha"]
# Salsa20
salsa20 = ["dep:tc_salsa20"]
# RC4，BC 的名稱是 ARC4
rc4 = ["dep:tc_rc4_family"]
# VMPC 與 VMPC-KSA3
vmpc = ["dep:tc_rc4_family"]
# HC-128 與 HC-256
hc = ["dep:tc_hc"]
# Ascon-AEAD128 與 Ascon v1.2 的 AEAD。BC 的工廠沒有，名稱是自訂的，所以預設不開
ascon = ["dep:tc_ascon_aead"]
# RSA：cipher、金鑰對，與 PKCS#1 v1.5 簽章（SHA-256withRSA 這類，digest 依各自的 feature）
rsa = [
    "dep:tc_rsa",
    "dep:tc_bigint",
    "dep:tc_asym_cipher",
    "dep:tc_asym_encoding",
    "dep:tc_rsa_signer",
    "dep:tc_asn1_x509",
]
iso9796 = ["rsa", "dep:tc_asym_iso9796"]
# CFRG 曲線：x25519、x448 有金鑰對與 agreement，ed25519、ed448 有金鑰對與 signer
x25519 = ["dep:tc_cfrg_curves", "dep:tc_asym_cipher"]
x448 = ["dep:tc_cfrg_curves", "tc_cfrg_curves/x448", "dep:tc_asym_cipher"]
ed25519 = ["dep:tc_cfrg_curves", "dep:tc_asym_cipher"]
ed448 = ["dep:tc_cfrg_curves", "tc_cfrg_curves/ed448", "dep:tc_asym_cipher"]
# 質數體的 SEC 2 曲線與 SM2：secp224k1 到 secp521r1、sm2p256v1。曲線一定要在 init 明確指定。
# 金鑰產生與 ECDH；之後接上 ECDSA
ec = [
    "dep:tc_ec_key",
    "dep:tc_ecdh_v2",
    "dep:tc_ec_core",
    "dep:tc_fp_custom",
    "dep:tc_bigint",
    "dep:tc_asym_cipher",
]
# ECIES：BC CipherUtilities 的組合，ECDH 加 KDF2(SHA-1) 與 HMAC(SHA-1)，XOR 加密；雙方都是靜態金鑰。
# 用到 SHA-1，所以跟 sha1 一樣不在預設裡
ecies = ["ec", "sha1", "dep:tc_ies", "dep:tc_kdf"]
# 以密碼加密，同 BC 的 PbeUtilities：PKCS#5 v1、PKCS#12 與 OpenSSL 的方案。各方案另外要它的 digest 與
# cipher 的 feature 都開了才會出現；方案都是舊的組合，所以不在預設裡
pbe = ["dep:tc_pbe", "tc_pbe/pbkdf2", "dep:tc_asn1_pkcs", "dep:tc_asn1_x509"]
# 金鑰與 DER 互轉，同 BC 的 PrivateKeyFactory、PublicKeyFactory、PrivateKeyInfoFactory 與
# SubjectPublicKeyInfoFactory：私鑰是 PKCS#8 的 PrivateKeyInfo，公鑰是 X.509 的 SubjectPublicKeyInfo。
# 只轉換已開啟的演算法（rsa、x25519、x448、ed25519、ed448、ec）的金鑰
key-factory = ["dep:tc_asn1_pkcs", "dep:tc_asn1_x509", "dep:tc_asn1_x9"]
# 二元體的 SEC 2 曲線：sect233k1 到 sect571r1
ec-f2m = ["ec", "dep:tc_f2m_custom"]
# 強度不足的小曲線，只為互通：secp112r1、secp112r2、secp128r1、secp128r2、secp160k1、secp160r1、
# secp160r2、secp192k1、secp192r1（NIST 已不准新系統使用 192 bits）；
# 開了 ec-f2m 時再加 sect113r1 到 sect193r2（同樣不到 112 bits）
ec-small-curves = [
    "ec",
    "dep:tc_fp_curve",
    "tc_fp_curve/small-curves",
    "tc_fp_custom/small-curves",
    "tc_f2m_custom?/small-curves",
]
# 引擎改用 RustCrypto 的實作：AES 沒有 AES-NI 時也是常數時間，ARIA 與 Camellia 改走 RustCrypto，RC 系列只影響 RC2，
# ChaCha、Salsa20 與 RC4 在 RustCrypto 涵蓋的長度上改走它，
# DES 與 Triple DES 改用 S-box 較小、key schedule 無分支的引擎。
# 只作用在已開啟的演算法，不會連帶開啟它們。
rustcrypto = [
    "tc_aes?/rustcrypto",
    "tc_aria?/rustcrypto",
    "tc_camellia?/rustcrypto",
    "tc_des?/rustcrypto",
    "tc_rc_cipher?/rustcrypto",
    "tc_chacha?/rustcrypto",
    "tc_salsa20?/rustcrypto",
    "tc_rc4_family?/rustcrypto",
    "tc_rsa?/rustcrypto",
    "tc_asym_iso9796?/rustcrypto",
]

[dependencies]
tc_aead_cipher = { version = "0.1.0", features = ["alloc"] }
tc_block_cipher = "0.1.0"
tc_block_modes = { version = "0.1.0", features = ["alloc"] }
tc_buffered_cipher = { version = "0.1.1", features = ["alloc"] }
tc_block_padding = { version = "0.1.0", features = ["rand_core"] }
tc_agreement = { version = "0.1.0", path = "../agreement/tc_agreement" }
tc_asn1 = "0.1.1"
tc_asn1_pkcs = { version = "0.1.0", path = "../../asn1/tc_asn1_pkcs", optional = true }
tc_asn1_x509 = { version = "0.1.0", path = "../../asn1/tc_asn1_x509", optional = true }
tc_asn1_x9 = { version = "0.1.0", path = "../../asn1/tc_asn1_x9", optional = true }
tc_digest = "0.1.0"
tc_key_wrap = { version = "0.1.0", features = ["rfc3394"] }
tc_macs = { version = "0.1.0", features = ["hmac", "cbc-mac", "alloc"] }
tc_keccak = { version = "0.1.0", optional = true }
tc_md = { version = "0.1.1", optional = true }
tc_rc_cipher = { version = "0.1.0", optional = true }
tc_sha = { version = "0.1.1", optional = true }
tc_aes = { version = "0.1.0", optional = true }
tc_aria = { version = "0.1.0", optional = true }
tc_camellia = { version = "0.1.0", optional = true }
tc_des = { version = "0.1.1", optional = true }
tc_ascon_aead = { version = "0.1.0", optional = true }
tc_chacha = { version = "0.1.0", optional = true }
tc_hc = { version = "0.1.0", optional = true }
tc_rc4_family = { version = "0.1.0", optional = true }
tc_salsa20 = { version = "0.1.0", optional = true }
tc_rsa = { version = "0.1.0", optional = true }
tc_asym_cipher = { version = "0.1.0", optional = true }
tc_asym_encoding = { version = "0.1.0", optional = true }
tc_asym_iso9796 = { version = "0.1.0", optional = true }
tc_bigint = { version = "0.1.0", optional = true }
tc_cfrg_curves = { version = "0.1.0", path = "../tc_cfrg_curves", optional = true }
tc_ec_core = { version = "0.1.0", optional = true }
tc_ec_key = { version = "0.1.0", path = "../tc_ec_key", optional = true }
tc_ecdh_v2 = { version = "0.1.0", path = "../agreement/tc_ecdh_v2", optional = true }
tc_f2m_custom = { version = "0.1.0", optional = true }
tc_fp_curve = { version = "0.1.0", optional = true }
tc_fp_custom = { version = "0.1.0", optional = true }
tc_rsa_signer = { version = "0.1.0", path = "../../signer/tc_rsa_signer", optional = true }
tc_signer = { version = "0.1.0", path = "../../signer/tc_signer" }
tc_ies = { version = "0.1.0", path = "../../ies/tc_ies", optional = true }
tc_kdf = { version = "0.1.0", path = "../../kdf/tc_kdf", optional = true }
tc_pbe = { version = "0.1.0", path = "../../kdf/tc_pbe", optional = true }
tc_stream_cipher = "0.1.0"
tc_zeroize = "0.1.0"
rand = { workspace = true }

[dev-dependencies]
tc_asym_cipher = "0.1.0"

[package]
name = "tc_algo_v2"
description = "Name- and OID-based factories for digests, MACs, ciphers, signers and more, after Bouncy Castle C#'s Org.BouncyCastle.Security."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
# Digest
sha256 = ["dep:tc_sha", "dep:tc_digest"]

# Block Cipher
aes = ["dep:tc_aes", "dep:tc_block_modes", "dep:tc_buffered_cipher"]

[dependencies]
tc_asn1 = { version = "0.1.2", features = ["zeroize"] }
tc_block_modes = { version = "0.1.1", features = ["alloc"], optional = true }
tc_buffered_cipher = { version = "0.1.1", features = ["alloc"], optional = true }
tc_constant_time = "0.1.0"
tc_digest = { version = "0.1.1", optional = true }
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

# Digest
tc_sha = { version = "0.1.1", optional = true }

# Block Cipher
tc_aes = { version = "0.1.0", optional = true }

[package]
name = "tc_aes"
description = "AES block cipher implementation for the tc_rust workspace."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Ignore AES-NI even on x86, so that the portable backend is always exercised.
force-portable-aes = []

[dependencies]
tc_cipher = { version = "0.1", path = "../../tc_cipher" }
tc_crypto = { version = "0.1", path = "../../tc_crypto" }
tc_params = { version = "0.1", path = "../../tc_params" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "aes"
harness = false

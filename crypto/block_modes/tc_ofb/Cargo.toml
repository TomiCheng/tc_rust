[package]
name = "tc_ofb"
description = "OFB and GCTR block cipher modes for the tc_rust workspace."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["alloc"]
alloc = []

[dependencies]
tc_cipher = { version = "0.1", path = "../../tc_cipher" }
tc_crypto = { version = "0.1", path = "../../tc_crypto" }
tc_params = { version = "0.1", path = "../../tc_params" }

[dev-dependencies]
tc_aes = { version = "0.1", path = "../../block_cipher/tc_aes" }
tc_gost28147 = { version = "0.1", path = "../../block_cipher/tc_gost28147" }

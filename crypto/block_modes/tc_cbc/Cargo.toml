[package]
name = "tc_cbc"
description = "CBC block cipher mode implementation for the tc_rust workspace."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["alloc"]
alloc = []

[dependencies]
tc_cipher = { version = "0.1", path = "../../tc_cipher" }
tc_crypto = { version = "0.1", path = "../../tc_crypto" }

[dev-dependencies]
tc_aes = { version = "0.1", path = "../../block_cipher/tc_aes" }
tc_des = { version = "0.1", path = "../../block_cipher/tc_des" }
tc_params = { version = "0.1", path = "../../tc_params" }

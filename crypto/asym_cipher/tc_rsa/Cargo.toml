[package]
name = "tc_rsa_v2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
alloc = ["dep:rand_core", "tc_bigint/alloc", "tc_modular/alloc", "tc_prime/alloc"]

[dependencies]
rand_core = { version = "0.10.1", default-features = false, optional = true }
tc_asym_cipher = { version = "0.1.0", path = "../tc_asym_cipher" }
tc_zeroize = "0.1.0"
tc_bigint = "0.1.0"
tc_modular = "0.1.0"
tc_prime = "0.1.0"

[dev-dependencies]
rand = "0.10.3"

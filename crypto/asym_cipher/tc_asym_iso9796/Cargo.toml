[package]
name = "tc_asym_iso9796"
description = "ISO/IEC 9796 digital signatures with message recovery, after Bouncy Castle's ISO9796d1Encoding and Iso9796d2Signer."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
rustcrypto = ["tc_rsa_v2/rustcrypto"]

[dependencies]
rand_core = "0.10.1"
tc_asym_cipher = { version = "0.1.0", path = "../tc_asym_cipher" }
tc_bigint = "0.1.0"
tc_rsa_v2 = { version = "0.1.0", path = "../tc_rsa" }

[dev-dependencies]
rand = "0.10.3"

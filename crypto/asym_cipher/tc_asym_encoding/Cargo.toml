[package]
name = "tc_asym_encoding"
description = "Encodings over asymmetric block ciphers: PKCS#1 v1.5, OAEP and ISO 9796-1, after Bouncy Castle's crypto/encodings."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
alloc = ["tc_zeroize/alloc"]

[dependencies]
rand_core = "0.10.1"
tc_digest = "0.1.0"
tc_asym_cipher = { version = "0.1.0", path = "../tc_asym_cipher" }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = "0.10.3"
tc_bigint = "0.1.0"
tc_rsa_v2 = { version = "0.1.0", path = "../tc_rsa", features = ["alloc"] }
tc_sha = "0.1.1"

[package]
name = "tc_blake"
description = "BLAKE2b, BLAKE2s, BLAKE2xs and BLAKE3, ported from Bouncy Castle C#."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_digest = "0.1.0"

# x86 上以 tc_runtime 偵測 AVX2／SSE2（不需要 std），有就走 SIMD 的壓縮函數
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "blake2b"
harness = false

[[bench]]
name = "blake2s"
harness = false

[package]
name = "tc_blake"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
description = "BLAKE2b, BLAKE2s and BLAKE2xs (RFC 7693) and BLAKE3, with x86 vector code for BLAKE2 and an optional backend on the blake3 crate."
readme = "README.md"
documentation = "https://docs.rs/tc_blake"
keywords = ["blake2", "blake3", "hash", "xof", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# BLAKE3 on the BLAKE3 team's blake3 crate: several chunks at once and SIMD
# chosen at run time, without std.
blake3 = ["dep:blake3", "dep:zeroize"]

[dependencies]
tc_digest = "0.1.0"
# Wipes the state, buffers and keys on drop.
tc_zeroize = "0.1.0"
blake3 = { version = "1.8", optional = true, default-features = false, features = ["zeroize"] }
zeroize = { version = "1", optional = true, default-features = false }

# Detects AVX2 and SSE2 on x86 without std, for the BLAKE2 vector code.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "blake2b"
harness = false

[[bench]]
name = "blake2s"
harness = false

[[bench]]
name = "blake3"
harness = false

[package.metadata.docs.rs]
all-features = true

[package]
name = "tc_blake2"
description = "BLAKE2 digest and extendable-output functions for the tc_rust workspace."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
tc_digest = { version = "0.1", path = "../../tc_digest" }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "blake2b"
harness = false

[[bench]]
name = "blake2s"
harness = false

[workspace]
resolver = "3"
members = ["crates/*", "crypto/tc_*", "crypto/block_cipher/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TomiCheng/tc_rust"

[workspace.dependencies]
# 只取 RngCore 等 trait；預設 no_std（default-features = false），熵來源由呼叫端提供。
rand_core = { version = "0.10.1", default-features = false }

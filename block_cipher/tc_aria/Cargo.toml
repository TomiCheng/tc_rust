[package]
name = "tc_aria"
description = "ARIA-128, ARIA-192 and ARIA-256 single-block encryption."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
rustcrypto = ["dep:aria", "aria/zeroize"]

[dependencies]
tc_block_cipher = "0.1.0"
tc_zeroize = "0.1.0"
aria = { version = "0.2", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "aria"
harness = false
